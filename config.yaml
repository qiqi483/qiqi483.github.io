# ↓↓↓ 上线后必须改成你的真实地址！本地预览阶段先保持这样也行 ↓↓↓
baseURL: "https://qiqi483.github.io/"
languageCode: "zh-cn"
locale: "zh-cn"                # Hugo v0.158+ 用 locale，不加会有 languageCode 弃用警告（仅警告，不影响运行）
theme: "hugo-theme-stack"
title: "qiqi的神秘日志"          # 网站标题，改成你的
copyright: "© 2026 qiqi"   # 底部版权

# 分页：每页显示几篇文章
pagination:
  pagerSize: 5

# Stack 主题的核心配置
params:
  mainSections:
    - post
    - games
    - life
    - projects

  sidebar:
    subtitle: "山不在高，水不在深，有志者必成事"
    avatar: img/avatar.png

  article:
    math: false
    toc: true

  comments:
    enabled: false

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

# 顶部/侧边菜单
menu:
  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/qiqi483"
      params:
        icon: brand-github
    - identifier: bilibili
      name: 哔哩哔哩
      url: "https://www.bilibili.com/"
      params:
        icon: brand-bilibili
        newTab: true

  main:
    - identifier: search
      name: 搜索
      url: /search/
      params:
        icon: search
    - identifier: games
      name: 游戏制作
      url: /games/
      params:
        icon: hash
    - identifier: projects
      name: 项目
      url: /projects/
      params:
        icon: apps
    - identifier: links
      name: 收藏文章
      url: /links/
      params:
        icon: link
    - identifier: life
      name: 日常生活
      url: /life/
      params:
        icon: home
    - identifier: admin
      name: 管理后台
      url: /admin/
      params:
        icon: user
    - identifier: bg-photo
      name: 背景照片
      url: "https://cn.bing.com/search?qs=SC&pq=beijingzhaopian&sk=CSYN1SC5&sc=13-15&pglt=43&q=%E8%83%8C%E6%99%AF%E7%85%A7%E7%89%87%E5%8A%A8%E6%BC%AB&cvid=33d26d1f23da475c99b8a6acade0d93a&gs_lcrp=EgRlZGdlKgYIBhAAGEAyBggAEEUYOTIGCAEQABhAMgYIAhAAGEAyBggDEAAYQDIGCAQQABhAMgYIBRAAGEAyBggGEAAYQDIGCAcQABhAMgYICBAAGEDSAQg5NTI5ajBqN6gCCLACAQ&FORM=ANNTA1&adppc=EDGEESS&PC=CNNDSE"
      params:
        icon: back
        newTab: true

# 让文章摘要、代码高亮等更好看
markup:
  goldmark:
    renderer:
      unsafe: true               # 允许 Markdown 里写 HTML
  highlight:
    noClasses: false