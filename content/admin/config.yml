backend:
  name: github
  repo: qiqi483/qiqi483.github.io
  branch: main
  commit_messages:
    create: "Create {{collection}} \"{{slug}}\""
    update: "Update {{collection}} \"{{slug}}\""
    delete: "Delete {{collection}} \"{{slug}}\""
    uploadMedia: "[skip ci] Upload \"{{path}}\""
    deleteMedia: "[skip ci] Delete \"{{path}}\""

publish_mode: editorial_workflow
local_backend: true
media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "post"
    label: "博客文章"
    folder: "content/post"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "分类", name: "categories", widget: "list", default: [] }
      - { label: "封面图片", name: "image", widget: "image", required: false }
      - { label: "内容", name: "body", widget: "markdown" }

  - name: "games"
    label: "游戏制作"
    folder: "content/games"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "分类", name: "categories", widget: "list", default: [] }
      - { label: "内容", name: "body", widget: "markdown" }

  - name: "life"
    label: "日常生活"
    folder: "content/life"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "分类", name: "categories", widget: "list", default: [] }
      - { label: "封面图片", name: "image", widget: "image", required: false }
      - { label: "内容", name: "body", widget: "markdown" }

  - name: "links"
    label: "收藏文章"
    folder: "content/page/links"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "内容", name: "body", widget: "markdown" }

  - name: "pages"
    label: "页面"
    files:
      - file: "content/page/search/index.md"
        label: "搜索页面"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "布局", name: "layout", widget: "hidden", default: "search" }